# Crochets Git locaux — mêmes contrôles que la CI, en plus rapide.
pre-commit:
  parallel: true
  commands:
    format:
      glob: '*.{js,mjs,ts,tsx,vue,json,md,mdx,yml,yaml,css}'
      run: pnpm prettier --check {staged_files}
    lint:
      glob: '*.{js,mjs,ts,tsx}'
      run: pnpm eslint --max-warnings=0 {staged_files}
commit-msg:
  commands:
    commitlint:
      run: pnpm commitlint --edit {1}
