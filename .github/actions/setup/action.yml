name: Installer l'environnement NYEMA
description: Node (version .nvmrc), pnpm (version packageManager) et dépendances avec cache.
inputs:
  registry-url:
    description: Registre npm à configurer (publication)
    required: false
    default: ''
runs:
  using: composite
  steps:
    - uses: actions/setup-node@v7
      with:
        node-version-file: .nvmrc
        registry-url: ${{ inputs.registry-url }}
        scope: ${{ inputs.registry-url != '' && '@nyema-r-d' || '' }}
    - name: pnpm (corepack, version du champ packageManager)
      shell: bash
      run: corepack enable && echo "PNPM_STORE=$(pnpm store path --silent)" >> "$GITHUB_ENV"
    - uses: actions/cache@v6
      with:
        path: ${{ env.PNPM_STORE }}
        key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
        restore-keys: pnpm-${{ runner.os }}-
    - run: pnpm install --frozen-lockfile
      shell: bash
