name: Nettoyage

on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  issues: write
  pull-requests: write

jobs:
  stale:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/stale@v11
        with:
          days-before-stale: 45
          days-before-close: 14
          exempt-issue-labels: pinned,status:in-progress,status:needs-founders
          exempt-all-milestones: true
          stale-issue-label: stale
          stale-pr-label: stale
          stale-issue-message: |
            Cette issue est inactive depuis 45 jours ; elle sera fermée dans 14 jours sans nouvelle activité.
            *Nin baara in ma lamaga tile 45 kɔnɔ ; n'a ma lamaga tile 14 kɔnɔ, a bɛ datugu.*
          stale-pr-message: |
            Cette PR est inactive depuis 45 jours ; elle sera fermée dans 14 jours sans nouvelle activité.
            *Nin PR in ma lamaga tile 45 kɔnɔ ; n'a ma lamaga tile 14 kɔnɔ, a bɛ datugu.*
