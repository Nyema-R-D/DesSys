# Pipeline Node réutilisable par tous les dépôts NYEMA.
# Contrat : .nvmrc, packageManager pnpm et scripts format:check, lint, build:packages, typecheck, test, publint.
#   jobs:
#     ci:
#       uses: Nyema-R-D/DesSys/.github/workflows/reusable-node-ci.yml@main
#       with: { storybook: false }
name: Pipeline Node NYEMA (réutilisable)

on:
  workflow_call:
    inputs:
      storybook:
        description: Construire Storybook
        type: boolean
        default: false
      build-command:
        type: string
        default: pnpm build
      upload-artifacts:
        description: Chemins (un par ligne) à publier en artefact après le build
        type: string
        default: ''

permissions:
  contents: read

jobs:
  qualite:
    name: Qualité · format, lint, types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - name: pnpm (corepack, version du champ packageManager)
        run: corepack enable && echo "PNPM_STORE=$(pnpm store path --silent)" >> "$GITHUB_ENV"
      - uses: actions/cache@v6
        with:
          path: ${{ env.PNPM_STORE }}
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm build:packages
      - run: pnpm typecheck

  tests:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - name: pnpm (corepack, version du champ packageManager)
        run: corepack enable && echo "PNPM_STORE=$(pnpm store path --silent)" >> "$GITHUB_ENV"
      - uses: actions/cache@v6
        with:
          path: ${{ env.PNPM_STORE }}
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:packages
      - run: pnpm test

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [qualite, tests]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - name: pnpm (corepack, version du champ packageManager)
        run: corepack enable && echo "PNPM_STORE=$(pnpm store path --silent)" >> "$GITHUB_ENV"
      - uses: actions/cache@v6
        with:
          path: ${{ env.PNPM_STORE }}
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-
      - run: pnpm install --frozen-lockfile
      - run: ${{ inputs.build-command }}
      - run: pnpm publint
      - if: inputs.storybook
        run: pnpm build:storybook
      - if: inputs.upload-artifacts != ''
        uses: actions/upload-artifact@v7
        with:
          name: build
          path: ${{ inputs.upload-artifacts }}
          retention-days: 14
