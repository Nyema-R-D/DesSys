# Régression visuelle : chaque story, thèmes anthracite et papier, comparée aux références
# packages/react/visual/__screenshots__. Pour régénérer les références (image Linux de référence,
# commit sur la branche) : label « visual:update » sur la PR, ou lancement manuel avec « update ».
name: Visuel

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
    paths: [packages/**, pnpm-lock.yaml, .github/workflows/visual.yml]
  workflow_dispatch:
    inputs:
      update:
        description: Régénérer et committer les captures de référence
        type: boolean
        default: false

concurrency:
  group: visual-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  UPDATE: ${{ inputs.update || contains(github.event.pull_request.labels.*.name, 'visual:update') }}

jobs:
  captures:
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/playwright:v1.64.1-noble
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - uses: ./.github/actions/setup
      - run: pnpm build:packages
      - run: pnpm build:storybook
      - name: Références présentes ?
        if: env.UPDATE != 'true'
        run: |
          if [ ! -d packages/react/visual/__screenshots__ ]; then
            echo "::error::Aucune capture de référence. Lancez le workflow « Visuel » avec update sur cette branche."
            exit 1
          fi
      - name: Comparer les captures
        run: pnpm --filter @nyema-r-d/react exec playwright test ${{ env.UPDATE == 'true' && '--update-snapshots' || '' }}
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: rapport-visuel
          path: |
            packages/react/visual-report
            packages/react/test-results
          retention-days: 14
      - name: Committer les références
        if: env.UPDATE == 'true'
        run: |
          git config user.name "nyema-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/react/visual/__screenshots__
          git diff --cached --quiet && { echo "Références inchangées."; exit 0; }
          git commit -m "test(react): met à jour les captures de référence"
          git push
      - name: Retirer le label
        if: env.UPDATE == 'true' && github.event_name == 'pull_request'
        uses: actions/github-script@v9
        with:
          script: |
            await github.rest.issues.removeLabel({
              ...context.repo,
              issue_number: context.payload.pull_request.number,
              name: 'visual:update',
            });
