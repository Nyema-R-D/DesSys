name: CI

on:
  pull_request:
  push:
    branches: [main, next]
  merge_group:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  pipeline:
    uses: ./.github/workflows/reusable-node-ci.yml
    with:
      storybook: true
      upload-artifacts: |
        packages/*/dist
        apps/reference/dist
        packages/react/storybook-static

  commits:
    name: Conventional Commits
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - run: pnpm commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }} --verbose

  bamanankan:
    name: Inventaire bamanankan à jour
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Tout texte BM ajouté doit figurer dans le document de relecture native (#23).
      - run: node scripts/i18n/bm-review.mjs
      - run: |
          git diff --exit-code docs/i18n/ || {
            echo "::error::docs/i18n/relecture-bm.md n'est pas à jour : lancez pnpm i18n:bm et committez le résultat."
            exit 1
          }

  dependances:
    name: Revue des dépendances
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    continue-on-error: true # nécessite le graphe de dépendances (public ou GHAS)
    steps:
      - uses: actions/checkout@v7
      - uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high
